[package]
name = "horizon-crates"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Operator-managed crate and weighted reward system for Horizon"

[lib]
path = "mixins/crates/core.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
resolver = "2"
